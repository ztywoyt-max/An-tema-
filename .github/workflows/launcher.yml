# Compila e testa o launcher e gera o instalador do Windows.
# Publicação: quando "version" em launcher/package.json muda na main, a release vX.Y.Z é criada
# automaticamente e os launchers instalados se atualizam sozinhos. Mesma versão = nada é republicado.
name: Launcher

on:
  push:
    branches: [main]
    paths: ['launcher/**', 'modpack/manifest.json', '.github/workflows/launcher.yml']
    tags: ['launcher-v*']
  pull_request:
    paths: ['launcher/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    env:
      ANATEMA_DIST_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/modpack/manifest.json
      ANATEMA_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Gerar instalador
        run: npm run build && npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ANATEMA-Launcher-Windows
          path: launcher/release/*.exe
          retention-days: 30
      # Publica a release vX.Y.Z (uma vez por versão). O latest.yml é o que os launchers
      # instalados consultam para se atualizar sozinhos.
      - name: Publicar release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          V=$(node -p "require('./package.json').version")
          FILES=(release/*.exe release/*.blockmap release/latest.yml)
          ls -la "${FILES[@]}"
          if gh release view "v$V" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.exe$'; then
            echo "Release v$V já publicada com o instalador — nada a fazer."
          elif gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "${FILES[@]}" --clobber
          else
            gh release create "v$V" "${FILES[@]}" --target "$GITHUB_SHA" --latest \
              --title "ANÁTEMA $V" \
              --notes "Baixe **ANATEMA-Setup-$V.exe** e execute. O launcher se atualiza sozinho nas próximas versões."
          fi
