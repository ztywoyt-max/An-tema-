# Compila e testa o launcher. Em cada push gera o instalador do Windows como artefato;
# ao criar uma tag "launcher-v1.2.3" publica a versão (e o launcher dos jogadores se atualiza sozinho).
name: Launcher

on:
  push:
    branches: [main]
    paths: ['launcher/**', 'modpack/manifest.json', '.github/workflows/launcher.yml']
    tags: ['launcher-v*']
  pull_request:
    paths: ['launcher/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    env:
      ANATEMA_DIST_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/modpack/manifest.json
      ANATEMA_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#launcher-v}"
      - name: Gerar instalador
        run: npm run build && npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/launcher-v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ANATEMA-Launcher-Windows
          path: launcher/release/*.exe
          retention-days: 30
