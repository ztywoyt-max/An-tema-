# Compila e testa o launcher e gera o instalador do Windows.
# Publicação: quando "version" em launcher/package.json muda na main, a release vX.Y.Z é criada
# automaticamente e os launchers instalados se atualizam sozinhos. Mesma versão = nada é republicado.
name: Launcher

on:
  push:
    branches: [main]
    paths: ['launcher/**', 'modpack/manifest.json', '.github/workflows/launcher.yml']
    tags: ['launcher-v*']
  pull_request:
    paths: ['launcher/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    env:
      ANATEMA_DIST_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/modpack/manifest.json
      ANATEMA_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#launcher-v}"
      - name: Gerar instalador
        run: npm run build && npx electron-builder --win --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ANATEMA-Launcher-Windows
          path: launcher/release/*.exe
          retention-days: 30
