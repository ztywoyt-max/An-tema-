appId: br.anatema.launcher
productName: ANÁTEMA
copyright: Projeto da comunidade ANÁTEMA. Sem afiliação com Mojang ou Microsoft.
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/brand
    to: brand
  - from: resources/manifest.json
    to: manifest.json
  - from: resources/icon.png
    to: icon.png
asar: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ANATEMA-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: ANÁTEMA
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
linux:
  icon: resources/icon.png
  target: [AppImage]
  category: Game
publish:
  provider: github
  owner: ztywoyt-max
  repo: An-tema-
  releaseType: release
