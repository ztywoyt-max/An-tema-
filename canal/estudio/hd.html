<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estúdio HD</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 100vw; height: auto; }</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="tela"></canvas>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const [w, h] = (q.get('res') ?? '1920x1080').split('x').map(Number);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('tela'), antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(w, h, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = q.get('perfil') === 'ps2' ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
const cena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, w / h, 0.05, 900);
const { carregarCache } = await import('./motor-hd/cache.js');
await carregarCache();
const t0 = performance.now();
const fontes = [['Cinzel', 'cinzel/files/cinzel-latin-600-normal.woff2', {}], ['Cormorant Garamond', 'cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2', { style: 'italic' }]];
await Promise.all(fontes.map(async ([n, f, o]) => { const ff = new FontFace(n, `url(./node_modules/@fontsource/${f})`, o); await ff.load(); document.fonts.add(ff); }));
let obra;
if (q.get('filme')) {
  const { montarFilme } = await import('./motor-hd/filme.js');
  obra = await montarFilme({ renderer, cena, camera, w, h, q });
} else {
  const mod = await import(`./cenas-hd/${q.get('cena') ?? 'estilo-estrada'}.js`);
  obra = await mod.default({ THREE, renderer, cena, camera, w, h, q });
}
console.log(`montado em ${((performance.now() - t0) / 1000).toFixed(1)} s`);
const gl = renderer.getContext();
const pixels = new Uint8Array(w * h * 4);
window.estudio = {
  pronto: true,
  duracao: obra.duracao ?? 0,
  planos: obra.planos ?? [],
  // quadro cru (RGBA, de baixo para cima) em base64, para o ffmpeg
  quadro(t) {
    obra.quadro(t);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let s = '';
    for (let i = 0; i < pixels.length; i += 0x8000) s += String.fromCharCode.apply(null, pixels.subarray(i, i + 0x8000));
    return btoa(s);
  },
  foto(t = 0) {
    obra.atualizar?.(t);
    const a = performance.now();
    if (obra.quadro) obra.quadro(t); else if (obra.pos) obra.pos.comp.render(); else renderer.render(cena, camera);
    console.log(`quadro em ${((performance.now() - a) / 1000).toFixed(1)} s`);
    return obra.sobrepor ? obra.sobrepor(renderer.domElement) : renderer.domElement.toDataURL('image/png');
  },
};
</script>
</body>
</html>
